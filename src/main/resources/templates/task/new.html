<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Task</title>
</head>
<body>
<h1>New Task</h1>

<a href="/tasks/page">Back to List</a>

<div>
    <span>Login User: </span>
    <strong th:text="${loginUserId != null ? loginUserId : 'guest'}"></strong>
    <a th:if="${loginUserId == null}" href="/login">Login</a>
    <form th:if="${loginUserId != null}" method="post" action="/logout" style="display:inline">
        <button type="submit">Logout</button>
    </form>
</div>

<form method="post" action="/tasks/page">
    <div>
        <label>Title</label>
        <input type="text" name="title" required>
    </div>

    <div>
        <label>Content</label>
        <textarea name="content"></textarea>
    </div>

    <div>
        <label>Priority</label>
        <select name="priority" required>
            <option value="LOW">LOW</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="HIGH">HIGH</option>
        </select>
    </div>

    <div>
        <label>Due Date</label>
        <input type="date" name="dueDate">
    </div>

    <div>
        <label>Created By</label>
        <input type="text" name="createdBy" th:value="${loginUserId != null ? loginUserId : 'manager01'}" required>
    </div>

    <div>
        <label>Assigned To</label>
        <select name="assignedTo">
            <option value="">None</option>
            <option th:each="user : ${users}"
                    th:value="${user.userId}"
                    th:text="${user.userId}">
            </option>
        </select>
    </div>

    <button type="submit">Create</button>
</form>

</body>
</html>
