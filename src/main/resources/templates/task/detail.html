<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Detail</title>
</head>
<body>
<h1>Task Detail</h1>

<a href="/tasks/page">Back to List</a>

<div>
    <span>Login User: </span>
    <strong th:text="${loginUserId != null ? loginUserId : 'guest'}"></strong>
    <a th:if="${loginUserId == null}" href="/login">Login</a>
    <form th:if="${loginUserId != null}" method="post" action="/logout" style="display:inline">
        <button type="submit">Logout</button>
    </form>
</div>

<div th:if="${task.status.name() == 'CREATED'}">
    <h2>Assign Task</h2>
    <form method="post" th:action="@{/tasks/page/{id}/assign(id=${task.id})}">
        <div>
            <label>Assignee ID</label>
            <select name="assigneeId">
                <option value="">None</option>
                <option th:each="user : ${users}"
                        th:value="${user.userId}"
                        th:text="${user.userId}"
                        th:selected="${user.userId == task.assignedTo}">
                </option>
            </select>
        </div>

        <div>
            <label>Manager ID</label>
            <input type="text" name="managerId" th:value="${loginUserId != null ? loginUserId : 'manager01'}" required>
        </div>

        <div>
            <label>Comment</label>
            <input type="text" name="comment" value="Assign task">
        </div>

        <button type="submit">Assign</button>
    </form>
</div>

<div th:if="${task.status.name() == 'ASSIGNED' or task.status.name() == 'IN_PROGRESS'}">
    <h2>Change Status</h2>
    <form method="post" th:action="@{/tasks/page/{id}/status(id=${task.id})}">
        <div>
            <label>Status</label>
            <select name="status" required>
                <option value="IN_PROGRESS" th:if="${task.status.name() == 'ASSIGNED'}">IN_PROGRESS</option>
                <option value="SUBMITTED" th:if="${task.status.name() == 'IN_PROGRESS'}">SUBMITTED</option>
            </select>
        </div>

        <div>
            <label>Changed By</label>
            <input type="text" name="changedBy" th:value="${loginUserId != null ? loginUserId : task.assignedTo}" required>
        </div>

        <div>
            <label>Comment</label>
            <input type="text" name="comment" value="Status changed">
        </div>

        <button type="submit">Change Status</button>
    </form>
</div>

<div th:if="${task.status.name() == 'SUBMITTED'}">
    <h2>Review Task</h2>

    <form method="post">
        <div>
            <label>Reviewer ID</label>
            <input type="text" name="reviewerId" th:value="${loginUserId != null ? loginUserId : 'manager01'}" required>
        </div>

        <div>
            <label>Comment</label>
            <input type="text" name="comment" value="Review completed">
        </div>

        <button type="submit"
                th:formaction="@{/tasks/page/{id}/approve(id=${task.id})}">
            Approve
        </button>

        <button type="submit"
                th:formaction="@{/tasks/page/{id}/reject(id=${task.id})}">
            Reject
        </button>
    </form>
</div>

<h2>Task Info</h2>
<table border="1">
    <tr>
        <th>ID</th>
        <td th:text="${task.id}"></td>
    </tr>
    <tr>
        <th>Title</th>
        <td th:text="${task.title}"></td>
    </tr>
    <tr>
        <th>Content</th>
        <td th:text="${task.content}"></td>
    </tr>
    <tr>
        <th>Status</th>
        <td th:text="${task.status}"></td>
    </tr>
    <tr>
        <th>Priority</th>
        <td th:text="${task.priority}"></td>
    </tr>
    <tr>
        <th>Created By</th>
        <td th:text="${task.createdBy}"></td>
    </tr>
    <tr>
        <th>Assigned To</th>
        <td th:text="${task.assignedTo}"></td>
    </tr>
    <tr>
        <th>Due Date</th>
        <td th:text="${task.dueDate}"></td>
    </tr>
    <tr>
        <th>Created At</th>
        <td th:text="${task.createdAt}"></td>
    </tr>
    <tr>
        <th>Updated At</th>
        <td th:text="${task.updatedAt}"></td>
    </tr>
</table>

<h2>History</h2>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Before</th>
        <th>After</th>
        <th>Changed By</th>
        <th>Comment</th>
        <th>Created At</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="history : ${histories}">
        <td th:text="${history.id}"></td>
        <td th:text="${history.beforeStatus}"></td>
        <td th:text="${history.afterStatus}"></td>
        <td th:text="${history.changedBy}"></td>
        <td th:text="${history.comment}"></td>
        <td th:text="${history.createdAt}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
