<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h1>Login</h1>

<form method="post" action="/login">
    <div>
        <label>User ID</label>
        <input type="text" name="userId" value="manager01" required>
    </div>

    <div>
        <label>Password</label>
        <input type="password" name="passwd" value="1234" required>
    </div>

    <button type="submit">Login</button>
</form>

<p>
    <a href="/users/register">Register</a>
    <a href="/tasks/page">Task List</a>
</p>
</body>
</html>
